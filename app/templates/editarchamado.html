<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Chamado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <form action="" method="post">
        <h1>Editar Chamado</h1>
        <p>Nome: <input type="text" name="novotitulo" placeholder="{{chamado.titulo}}"></p>
        <p>Descricao: <input type="text" name="novadescricao" placeholder="{{chamado.descricao}}"></p>
        <select name="novacategoria" id="novacategoria">
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Rede">Rede</option>
            <option value="Acesso">Acesso</option>
            <option value="Outros">Outros</option>
        </select>
        <select name="novaprioridade" id="novaprioridade">
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
            <option value="Urgente">Urgente</option>
        </select>
        <select name="novostatus" id="novostatus">
            <option value="Pendente">Pendente</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluído">Concluído</option>
        </select>
        <button type="submit">Confirmar</button>
        <a href="/paineladmin">Volte para o Painel Admin</a>
    </form>
</body>
</html>
