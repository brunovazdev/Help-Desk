<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar exclusão</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <p>Tem certeza que deseja excluir a setor {{setor.setor}}?</p>
    <form action="{{ url_for('setor.excluir_setor', id=setor.id) }}" method="post">
        <input type="radio" name="confirmacao" value="sim" required> Sim
        <input type="radio" name="confirmacao" value="nao" required> Não
        <button type="submit">Confirmar</button>
    </form>
</body>
</html>
