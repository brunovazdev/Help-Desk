<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pedidos</title>
</head>
<body>
    <h1>Pedidos</h1>
    {%for pedido in pedidos%}
        <p>ID: {{pedido.id}} - Título: {{pedido.titulo}} - Descrição: {{pedido.descricao}} - ID do autor {{pedido.usuario_id}} - Empresa: {{pedido.usuario.empresa.empresa}}</p>
    {%endfor%}
    <h1>Novo pedido</h1>
    <form action="" method="post">
        <input type="text" name="titulo" placeholder="Título" required> <br>
        <input type="text" name="descricao" placeholder="Descrição" required> <br>
        <button type="submit">Criar Pedido</button>
    </form>
    <a href="/">Volte para Home Page</a>
</body>
</html>
