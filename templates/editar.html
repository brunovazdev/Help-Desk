<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
</head>
<body>
    <h1>Editar Usuário</h1>
    <form action="" method="post">
        <input type="text" name="id" placeholder="Digite o ID">
        <input type="text" name="nome" placeholder="Altere o Nome">
        <input type="text" name="idade" placeholder="Altere a Idade">
        <button type="submit">Editar</button>
    </form>
     {% with mensagens = get_flashed_messages() %}
        {%if mensagens %} <!--se for true-->
            {% for cadastrado in mensagens %}
                <p>{{ cadastrado }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <a href="/">Volte para Home Page</a>
</body>
</html>
