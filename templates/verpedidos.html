<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Pedidos</title>
</head>
<body>
    <h1>Pedidos</h1>
    {%for pedido in pedidos%}
        <p>ID: {{pedido.id}} - Título: {{pedido.titulo}} - Descrição: {{pedido.descricao}} - ID do autor {{pedido.usuario_id}} - Empresa: {{pedido.usuario.empresa.empresa}}</p>
    {%endfor%}
    <a href="/">Volte para Home Page</a>
</body>
</html>
