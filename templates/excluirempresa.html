<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar exclusão</title>
</head>
<body>
    <p>Tem certeza que deseja excluir a empresa {{empresa.empresa}}?</p>
    <form action="{{ url_for('excluir_empresa', id=empresa.id) }}" method="post">
        <input type="radio" name="confirmacao" value="sim" required> Sim
        <input type="radio" name="confirmacao" value="nao"> Não
        <button type="submit">Confirmar</button>
    </form>
</body>
</html>
